<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coiffure délirante</title>
<style>
:root{--bg:#fff6fb;--fg:#2a1633;--card:#fff;--ac:#ff2d95;--ac2:#7b3cff;--bd:#f0d3e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17101c;--fg:#f7e9ff;--card:#241a2c;--bd:#46335a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17101c;--fg:#f7e9ff;--card:#241a2c;--bd:#46335a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:1.6rem;margin:4px 0 2px;background:linear-gradient(90deg,#ff2d95,#ff9a00,#2ecc71,#2d8cff,#7b3cff);-webkit-background-clip:text;background-clip:text;color:transparent}
p.sub{margin:0 0 14px;opacity:.75}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
button,select,input[type=email]{font:inherit;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--fg);padding:11px 14px}
button{cursor:pointer;font-weight:600;flex:1}
button.p{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;color:#fff}
button:active{transform:scale(.97)}
select,input[type=email]{flex:1;min-width:0}
.stage{background:var(--card);border:2px dashed var(--bd);border-radius:18px;padding:8px;text-align:center}
#hint{padding:42px 12px;opacity:.7}
canvas{display:none;width:100%;height:auto;border-radius:12px;touch-action:none;cursor:grab}
label.s{display:flex;align-items:center;gap:10px;font-size:.9rem}
label.s input{flex:1}
#msg{min-height:1.4em;font-size:.9rem;opacity:.85}
#out{display:none;width:100%;border-radius:12px;margin-top:8px}
input[type=file]{display:none}
</style>
</head>
<body>
<main>
<h1>Coiffure délirante 🌈</h1>
<p class="sub">Prends un selfie, laisse la magie opérer, puis partage !</p>

<div class="row">
  <button class="p" id="bSelfie">📷 Selfie</button>
  <button id="bGal">🖼️ Galerie</button>
</div>
<input type="file" id="fSelfie" accept="image/*" capture="user">
<input type="file" id="fGal" accept="image/*">

<div class="stage">
  <div id="hint">Ajoute une photo de visage pour commencer 🙂</div>
  <canvas id="c"></canvas>
</div>

<div id="tools" style="display:none">
  <div class="row">
    <button class="p" id="bRnd">🎲 Nouvelle coupe</button>
    <select id="sty" aria-label="Style"></select>
  </div>
  <p class="sub" style="margin:6px 0 0">1 doigt : déplacer · 2 doigts : agrandir et tourner la perruque.</p>
  <div class="row">
    <input type="email" id="to" placeholder="Email du destinataire (optionnel)" autocomplete="email">
  </div>
  <div class="row">
    <button class="p" id="bMail">✉️ Envoyer</button>
    <button id="bSave">💾 Sauver</button>
  </div>
  <div id="msg"></div>
  <img id="out" alt="Résultat à enregistrer">
</div>
</main>

<script>
(function(){
var C=document.getElementById("c"),g=C.getContext("2d");
var img=null,st={cx:0,cy:0,s:0,rot:0,seed:1,style:0};
var NAMES=["Afro arc-en-ciel","Crête punk","Tresses folles","Ressorts","Licorne","Pompons"];
var $=function(i){return document.getElementById(i)};
var sty=$("sty");
NAMES.forEach(function(n,i){var o=document.createElement("option");o.value=i;o.textContent=n;sty.appendChild(o)});

function msg(t){$("msg").textContent=t||""}
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function hair(){
  var R=mul(st.seed),r=st.s/2,x0=st.cx,y0=st.cy+r*.95,ry=r*1.05;
  var h=R()*360,P=[];
  for(var i=0;i<6;i++)P.push("hsl("+((h+i*(55+R()*40))%360)+",92%,"+(52+R()*10)+"%)");
  var col=function(i){return P[Math.abs(i)%P.length]};
  var A0=Math.PI+.45,A1=2*Math.PI-.45;
  var arc=function(a,k){k=k||1;return[x0+Math.cos(a)*r*k,y0+Math.sin(a)*ry*k]};
  g.lineCap="round";g.lineJoin="round";
  function S(pts,w,c){
    g.beginPath();pts.forEach(function(p,i){i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])});
    g.strokeStyle="rgba(0,0,0,.35)";g.lineWidth=w+5;g.stroke();
    g.strokeStyle=c;g.lineWidth=w;g.stroke();
  }
  function dot(p,rad,c){g.beginPath();g.arc(p[0],p[1],rad,0,7);g.fillStyle="rgba(0,0,0,.35)";g.fill();g.beginPath();g.arc(p[0],p[1],rad-2.5,0,7);g.fillStyle=c;g.fill()}
  function wavy(a,L,amp,fr,grav,steps){
    var b=arc(a,.96),dx=Math.cos(a),dy=Math.sin(a),ph=R()*6.28,pts=[];
    for(var i=0;i<=steps;i++){var t=i/steps,o=amp*Math.sin(t*fr*6.283+ph)*t;
      pts.push([b[0]+dx*L*t-dy*o,b[1]+dy*L*t+dx*o+grav*t*t*L])}
    return pts;
  }
  // calotte colorée (le crâne)
  if(st.style!=0){
    g.beginPath();g.ellipse(x0,y0,r*.97,ry*.97,0,A0,A1);g.closePath();
    g.fillStyle=col(0);g.globalAlpha=.93;g.fill();g.globalAlpha=1;
    g.strokeStyle="rgba(0,0,0,.3)";g.lineWidth=4;g.stroke();
  }
  var n,i,a,p,L;
  if(st.style==0){
    for(var ring=3;ring>=0;ring--){
      n=16-ring*2;
      for(i=0;i<n;i++){
        a=A0-.15+(A1-A0+.3)*i/(n-1);
        p=arc(a,1.18+ring*.28);
        dot(p,r*(.42-ring*.04),col(i+ring*2));
      }
    }
    for(i=0;i<8;i++){dot(arc(A0+(A1-A0)*R(),1.0),r*.3,col(i+1))}
  }else if(st.style==1){
    n=11;
    for(i=0;i<n;i++){
      a=-Math.PI/2-.75+1.5*i/(n-1);
      L=r*(1.1+R()*1.1)*(1-Math.abs(a+Math.PI/2)*.4);
      var b1=arc(a-.11,.98),b2=arc(a+.11,.98),tip=[x0+Math.cos(a)*(r*1.0+L)+(R()-.5)*r*.3,y0+Math.sin(a)*(ry*.98+L)];
      g.beginPath();g.moveTo(b1[0],b1[1]);g.lineTo(tip[0],tip[1]);g.lineTo(b2[0],b2[1]);g.closePath();
      g.fillStyle=col(i);g.fill();g.strokeStyle="rgba(0,0,0,.4)";g.lineWidth=4;g.stroke();
    }
  }else if(st.style==2){
    n=15;
    for(i=0;i<n;i++){
      a=A0-.1+(A1-A0+.2)*i/(n-1);
      L=r*(1.4+R()*1.2);
      var pts=wavy(a,L,r*.35,1.2+R(),.55,22);
      S(pts,r*.2,col(i));dot(pts[pts.length-1],r*.17,col(i+3));
    }
  }else if(st.style==3){
    n=24;
    for(i=0;i<n;i++){
      a=A0-.1+(A1-A0+.2)*i/(n-1);
      L=r*(1.0+R()*.9);
      S(wavy(a,L,r*.26,4+R()*2,.35,40),r*.11,col(i));
    }
  }else if(st.style==4){
    n=9;
    for(i=0;i<n;i++){
      a=A0-.1+(A1-A0+.2)*i/(n-1);
      if(Math.abs(a+Math.PI/2)<.35)continue;
      S(wavy(a,r*(1.3+R()*.9),r*.3,1.4,.6,20),r*.17,col(i));
    }
    var tb=arc(-Math.PI/2,.9),H=r*2.1,W=r*.34,k=9;
    for(i=0;i<k;i++){
      var t0=i/k,t1=(i+1)/k;
      g.beginPath();
      g.moveTo(tb[0]-W*(1-t0),tb[1]-H*t0);g.lineTo(tb[0]+W*(1-t0),tb[1]-H*t0);
      g.lineTo(tb[0]+W*(1-t1),tb[1]-H*t1);g.lineTo(tb[0]-W*(1-t1),tb[1]-H*t1);g.closePath();
      g.fillStyle=col(i);g.fill();g.strokeStyle="rgba(0,0,0,.35)";g.lineWidth=3;g.stroke();
    }
  }else{
    n=22;
    for(i=0;i<n;i++){
      a=A0-.1+(A1-A0+.2)*i/(n-1);
      var q=arc(a,.96);L=r*(.55+R()*.5);
      var e=[q[0]+Math.cos(a)*L,q[1]+Math.sin(a)*L];
      S([q,e],r*.1,col(i));dot(e,r*(.2+R()*.12),col(i+2));
    }
  }
  // paillettes
  g.fillStyle="#fff";
  for(i=0;i<14;i++){
    a=A0-.5+(A1-A0+1)*R();var k2=1.2+R()*1.3,c=arc(a,k2),z=r*(.05+R()*.07);
    g.beginPath();g.moveTo(c[0],c[1]-z*2);g.lineTo(c[0]+z*.5,c[1]-z*.5);g.lineTo(c[0]+z*2,c[1]);g.lineTo(c[0]+z*.5,c[1]+z*.5);
    g.lineTo(c[0],c[1]+z*2);g.lineTo(c[0]-z*.5,c[1]+z*.5);g.lineTo(c[0]-z*2,c[1]);g.lineTo(c[0]-z*.5,c[1]-z*.5);g.closePath();g.fill();
  }
}

function draw(){
  if(!img)return;
  g.clearRect(0,0,C.width,C.height);
  g.drawImage(img,0,0,C.width,C.height);
  var py=st.cy+st.s*.475;
  g.save();g.translate(st.cx,py);g.rotate(st.rot);g.translate(-st.cx,-py);
  hair();
  g.restore();
}

function load(f){
  if(!f)return;
  var u=URL.createObjectURL(f),im=new Image();
  im.onload=function(){
    var k=Math.min(1,900/Math.max(im.width,im.height));
    C.width=Math.round(im.width*k);C.height=Math.round(im.height*k);
    img=im;
    st.cx=C.width/2;st.cy=C.height*.3;st.s=C.width*.55;st.rot=0;
    $("hint").style.display="none";C.style.display="block";$("tools").style.display="block";$("out").style.display="none";
    msg("");rnd();
    if("FaceDetector" in window){
      try{new FaceDetector({fastMode:true}).detect(C).then(function(fs){
        if(fs.length){var b=fs[0].boundingBox;st.cx=b.x+b.width/2;st.cy=b.y+b.height*.1;st.s=b.width*1.15;sync();draw()}
      }).catch(function(){})}catch(e){}
    }
    sync();draw();
  };
  im.src=u;
}
function sync(){}
function rnd(){st.seed=Math.floor(Math.random()*1e9);st.style=Math.floor(Math.random()*NAMES.length);sty.value=st.style;draw()}

$("bSelfie").onclick=function(){$("fSelfie").click()};
$("bGal").onclick=function(){$("fGal").click()};
$("fSelfie").onchange=function(e){load(e.target.files[0]);e.target.value=""};
$("fGal").onchange=function(e){load(e.target.files[0]);e.target.value=""};
$("bRnd").onclick=rnd;
sty.onchange=function(){st.style=+sty.value;st.seed=Math.floor(Math.random()*1e9);draw()};

var P={},g0=null;
function ptsArr(){return Object.keys(P).map(function(k){return P[k]})}
function snap(){
  var a=ptsArr();
  if(a.length==1){g0={n:1,x:a[0].x,y:a[0].y,cx:st.cx,cy:st.cy}}
  else if(a.length>=2){
    var dx=a[1].x-a[0].x,dy=a[1].y-a[0].y;
    g0={n:2,d:Math.hypot(dx,dy)||1,an:Math.atan2(dy,dx),mx:(a[0].x+a[1].x)/2,my:(a[0].y+a[1].y)/2,s:st.s,rot:st.rot,cx:st.cx,cy:st.cy};
  }else g0=null;
}
C.addEventListener("pointerdown",function(e){C.setPointerCapture(e.pointerId);P[e.pointerId]={x:e.clientX,y:e.clientY};snap()});
C.addEventListener("pointermove",function(e){
  if(!P[e.pointerId]||!g0)return;
  P[e.pointerId]={x:e.clientX,y:e.clientY};
  var a=ptsArr(),k=C.width/C.getBoundingClientRect().width;
  if(a.length==1&&g0.n==1){st.cx=g0.cx+(a[0].x-g0.x)*k;st.cy=g0.cy+(a[0].y-g0.y)*k}
  else if(a.length>=2&&g0.n==2){
    var dx=a[1].x-a[0].x,dy=a[1].y-a[0].y;
    st.s=Math.max(C.width*.1,Math.min(C.width*1.6,g0.s*Math.hypot(dx,dy)/g0.d));
    st.rot=g0.rot+Math.atan2(dy,dx)-g0.an;
    st.cx=g0.cx+((a[0].x+a[1].x)/2-g0.mx)*k;st.cy=g0.cy+((a[0].y+a[1].y)/2-g0.my)*k;
  }
  draw();
});
function up(e){delete P[e.pointerId];snap()}
C.addEventListener("pointerup",up);C.addEventListener("pointercancel",up);
C.addEventListener("wheel",function(e){e.preventDefault();st.s=Math.max(C.width*.1,Math.min(C.width*1.6,st.s*(e.deltaY<0?1.06:.94)));draw()},{passive:false});

function blob(){return new Promise(function(res){C.toBlob(res,"image/png")})}

function showFallback(b){
  var o=$("out");o.src=URL.createObjectURL(b);o.style.display="block";
  msg("Appuie longuement sur l’image ci-dessous pour l’enregistrer 📲");
}

$("bSave").onclick=async function(){
  var b=await blob();
  try{
    var d=await claude.use("downloads");
    if(!d){showFallback(b);return}
    await d.save({filename:"coiffure-delirante.png",data:b});
    msg("Image prête ✅");
  }catch(e){
    if(e&&e.code==="declined"){msg("");return}
    showFallback(b);
  }
};

$("bMail").onclick=async function(){
  var b=await blob(),to=$("to").value.trim();
  var a=document.createElement("a");
  a.href="mailto:"+encodeURIComponent(to)+"?subject="+encodeURIComponent("Ma coiffure délirante 🌈")+"&body="+encodeURIComponent("Salut !\n\nRegarde ma nouvelle coupe délirante 🌈\n\n(Pense à joindre l’image enregistrée.)");
  a.click();
  showFallback(b);
  msg("Ton appli mail s’ouvre avec le message pré-rempli. Enregistre l’image ci-dessous (appui long) puis joins-la.");
};
})();
</script>
</body>
</html>
